apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securemcp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [securemcp.example.com]
      secretName: securemcp-tls
  rules:
    - host: securemcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securemcp
                port: {number: 8080}

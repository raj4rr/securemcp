services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securemcp
      POSTGRES_USER: securemcp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemcp -d securemcp"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["./keycloak/realm-securemcp.json:/opt/keycloak/data/import/realm-securemcp.json:ro"]
    profiles: ["keycloak"]
  vault:
    image: hashicorp/vault:1.18
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_DEV_TOKEN:-local-vault-dev-token}", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-local-vault-dev-token}
    cap_add: ["IPC_LOCK"]
    ports: ["127.0.0.1:8200:8200"]
    profiles: ["vault-dev"]
  securemcp:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: http
      DB_URL: jdbc:postgresql://postgres:5432/securemcp
      DB_USER: securemcp
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SECUREMCP_ISSUER: ${SECUREMCP_ISSUER:-http://localhost:8080}
      SECUREMCP_AUDIENCE: ${SECUREMCP_AUDIENCE:-securemcp-api}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:8080,127.0.0.1:8080}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      SECUREMCP_BOOTSTRAP_ENABLED: ${SECUREMCP_BOOTSTRAP_ENABLED:-true}
      SECUREMCP_BOOTSTRAP_CLIENT_ID: ${SECUREMCP_BOOTSTRAP_CLIENT_ID:-securemcp-local-client}
      SECUREMCP_BOOTSTRAP_CLIENT_SECRET: ${SECUREMCP_BOOTSTRAP_CLIENT_SECRET:?Set SECUREMCP_BOOTSTRAP_CLIENT_SECRET in .env}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/securemcp}
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/securemcp/protocol/openid-connect/certs
      KEYCLOAK_DISCOVERY_URI: http://keycloak:8180/realms/securemcp/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-securemcp-api}
      VAULT_ENABLED: ${VAULT_ENABLED:-false}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_JWK_PATH: ${VAULT_JWK_PATH:-secret/data/securemcp/signing}
      SECUREMCP_JWK_SET_FILE: ${SECUREMCP_JWK_SET_FILE:-}
      SECUREMCP_ALLOW_EPHEMERAL_KEYS: ${SECUREMCP_ALLOW_EPHEMERAL_KEYS:-true}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  pgdata:
  redisdata:
